name: four_wishlist
description: A Flutter TMDB app with wishlist.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.0
  intl: ^0.18.1
  qr_flutter: ^4.1.0
  share_plus: ^10.1.0
  app_links: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  hive_generator: ^2.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true